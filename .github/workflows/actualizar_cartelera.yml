name: Actualizar Cartelera Nacional (Cero Costo)

on:
  schedule:
    # Se ejecuta todos los días a las 6:00 AM y 2:00 PM hora de Perú (UTC-5 -> 11:00 y 19:00 UTC)
    - cron: '0 11,19 * * *'
  # Permite ejecutarlo manualmente con un solo clic desde la app o web de GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Scraper Multacadena (~8 segundos)
        run: |
          python main.py --sin-disponibilidad

      - name: Guardar y publicar cartelera actualizada
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/peliculas.json data/actualizacion_estado.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Cartelera actualizada $(date +'%Y-%m-%d %H:%M')" && git push)
